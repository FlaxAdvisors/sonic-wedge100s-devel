[target]
# IP address or hostname of the Wedge 100S-32X running SONiC.
# In the home lab this is `lapin` on foreman's enp2s0 link (192.168.99.20).
# Reachable via SSH alias defined in ~/.ssh/config.
host = lapin
port = 22
username = admin
password = YourPaSsWoRd

# SSH private key (preferred — ssh-copy-id was run during home-lab bring-up).
key_file = ~/.ssh/id_ed25519

# Optional: connect timeout in seconds (default 30)
connect_timeout = 30

[links]
# Arista peer is not present in the home lab — tests that depend on these
# will skip or fail until a peer is wired in. Values left for schema.
peer_ip = 10.0.1.0
standalone_peer_ip = 10.0.0.0
